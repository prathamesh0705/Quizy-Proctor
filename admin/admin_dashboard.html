<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../common/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <script src="../common/js/bootstrap.bundle.min.js"></script>
    <script src="../common/js/sweetalert.min.js"></script>

    <link rel="stylesheet" href="admin_dashboard.css"> 
    
    <style>
        /* Sidebar Styling for Bootstrap Pills */
        .sidebar-menu a {
            padding: 10px 15px;
            display: block;
            color: #f8f9fa;
            text-decoration: none;
            border-left: 3px solid transparent;
        }
        .sidebar-menu .nav-link:hover, .sidebar-menu .nav-link.active {
            background-color: #495057;
            border-left: 3px solid #007bff;
            color: #fff !important; /* Ensure text remains white */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-tachometer-alt me-2"></i> Admin Panel</a>
            <button id="logout-btn" class="btn btn-outline-light"><i class="fas fa-sign-out-alt me-2"></i> Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 bg-secondary text-white min-vh-100 p-0 d-none d-md-block">
                <div class="p-3">
                    <h5 class="mt-3 mb-4 text-white-50">NAVIGATION</h5>
                    <div class="sidebar-menu nav flex-column nav-pills" id="admin-tabs" role="tablist" aria-orientation="vertical">
                        <a class="nav-link active" id="teachers-tab" data-bs-toggle="pill" href="#teachers-section" role="tab" aria-controls="teachers-section" aria-selected="true">
                            <i class="fas fa-chalkboard-teacher me-2"></i> Manage Teachers
                        </a>
                    </div>
                </div>
            </div>

            <main class="col-md-10 ms-sm-auto col-lg-10 p-4">
                
                <div class="tab-content" id="admin-tabContent">

                    <div class="tab-pane fade show active" id="teachers-section" role="tabpanel" aria-labelledby="teachers-tab">
                        <h1 class="h2 mb-4 text-dark"><i class="fas fa-users-cog"></i> Teacher Management</h1>
                        
                        <div class="row">
                            <div class="col-lg-5 mb-4">
                                <div class="card shadow-sm h-100">
                                    <div class="card-header bg-white">
                                        <h3><i class="fas fa-user-plus"></i> Register New Teacher</h3>
                                    </div>
                                    <div class="card-body">
                                        <form id="teacher-registration-form">
                                            <div class="mb-3">
                                                <label for="teacher-name" class="form-label">Teacher Name</label>
                                                <input type="text" required id="teacher-name" class="form-control">
                                            </div>
                                            <div class="mb-3">
                                                <label for="teacher-mobile" class="form-label">Mobile Number</label>
                                                <input type="text" required id="teacher-mobile" class="form-control">
                                            </div>
                                            <div class="mb-3">
                                                <label for="teacher-id" class="form-label">Teacher ID (Enrollment)</label>
                                                <input type="text" required id="teacher-id" class="form-control">
                                            </div>
                                            <div class="mb-4">
                                                <label for="teacher-password" class="form-label">Initial Password</label>
                                                <input type="password" required id="teacher-password" class="form-control">
                                            </div>
                                            <div class="d-grid">
                                                <button type="submit" class="btn btn-primary btn-lg">
                                                    <i class="fas fa-save me-2"></i> Register Teacher
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-7 mb-4">
                                <div class="card shadow-sm h-100">
                                    <div class="card-header bg-white">
                                        <h3><i class="fas fa-users"></i> Existing Teachers List</h3>
                                    </div>
                                    <div class="card-body p-0">
                                        <div class="table-responsive">
                                            <table class="table table-striped table-hover">
                                                <thead>
                                                    <tr>
                                                        <th scope="col" style="width: 5%;">#</th>
                                                        <th scope="col">Name</th>
                                                        <th scope="col">Teacher ID</th>
                                                        <th scope="col">Mobile</th>
                                                        <th scope="col" style="width: 10%;">Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="teachers-data-body">
                                                    </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                </div>
            </div>

    <script src="admin_dashboard.js"></script>
</body>
</html>
