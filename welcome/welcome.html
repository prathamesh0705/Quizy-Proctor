<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Pre-Test Instructions</title>

    <link rel="stylesheet" href="../common/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/welcome.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    
    <script src="../common/js/bootstrap.bundle.min.js"></script>
    <script src="../common/js/sweetalert.min.js"></script>
</head>
<body>

    <div class="welcome-container animate__animated animate__fadeIn">
        <div class="welcome-header">
            <h2>Pre-Test Instructions</h2>
            <p>Please read the following guidelines carefully before you begin.</p>
        </div>

        <div class="welcome-body">
            <ul class="guidelines-list">
                <li><i class="fa-solid fa-desktop"></i> Avoid switching tabs or minimizing the window.</li>
                <li><i class="fa-solid fa-volume-xmark"></i> Attempt the test in a quiet, silent place.</li>
                <li><i class="fa-solid fa-ban"></i> Do not use any cheating devices or external help.</li>
                <li><i class="fa-solid fa-face-smile"></i> ALL THE BEST !!</li>
            </ul>
        </div>
        
        <div class="welcome-footer">
            <select name="" id="select-subject-el" class="form-select">
                <option value="choose subject">Choose Your Subject</option>
            </select>
            <button class="btn start-quiz-btn">Start Quiz</button>
        </div>
    </div>

    <script src="js/welcome.js"></script>
</body>
</html>
